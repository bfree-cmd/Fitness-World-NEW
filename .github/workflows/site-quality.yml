name: Site Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run qa:static

  function-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run qa:functions

  production-health:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait briefly for Netlify production deploy
        run: sleep 75
      - run: npm run qa:live

  live-assets:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait briefly for Netlify production deploy
        run: sleep 75
      - name: Check legacy Pexels cache references on production
        run: node scripts/check-live-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: live-pexels-assets-report
          path: live-pexels-assets-report.json

  lighthouse:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: home
            url: https://comforting-marigold-ea2f43.netlify.app/
          - name: natural
            url: https://comforting-marigold-ea2f43.netlify.app/natural/
          - name: articles
            url: https://comforting-marigold-ea2f43.netlify.app/articles/
          - name: evidence-projects
            url: https://comforting-marigold-ea2f43.netlify.app/evidence-projects/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait briefly for Netlify production deploy
        run: sleep 75
      - name: Run Lighthouse mobile audit
        shell: bash
        run: |
          set +e
          URL="${{ matrix.url }}"
          for TARGET in "$URL" "$URL" "$URL"; do
            npx --yes lighthouse@13.5.0 "$TARGET" \
              --chrome-flags="--headless --no-sandbox" \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="lighthouse-${{ matrix.name }}.json"
            CODE=$?
            if [ "$CODE" -eq 0 ]; then exit 0; fi
            sleep 8
          done
          exit 1
      - name: Print Lighthouse scores
        run: |
          node -e "const r=require('./lighthouse-${{ matrix.name }}.json'); for (const k of ['performance','accessibility','best-practices','seo']) console.log(k+': '+Math.round(r.categories[k].score*100))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ matrix.name }}
          path: lighthouse-${{ matrix.name }}.json
          if-no-files-found: warn

  responsive-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated audit browser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Render all pages on desktop and mobile
        run: node scripts/audit-responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-rendering
          path: responsive-audit/
