name: Site Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run qa:static

  production-health:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait briefly for Netlify production deploy
        run: sleep 45
      - run: npm run qa:live

  live-assets:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait briefly for Netlify production deploy
        run: sleep 45
      - name: Check legacy Pexels cache references on production
        run: node scripts/check-live-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: live-pexels-assets-report
          path: live-pexels-assets-report.json

  lighthouse:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: home
            url: https://fitnessworld.pro/
          - name: natural
            url: https://fitnessworld.pro/natural/
          - name: articles
            url: https://fitnessworld.pro/articles/
          - name: evidence-projects
            url: https://fitnessworld.pro/evidence-projects/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait briefly for Netlify production deploy
        run: sleep 45
      - name: Run Lighthouse mobile audit
        run: |
          npx --yes lighthouse@12.2.1 "${{ matrix.url }}" \
            --chrome-flags="--headless --no-sandbox" \
            --form-factor=mobile \
            --screenEmulation.mobile=true \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path="lighthouse-${{ matrix.name }}.json"
      - name: Print Lighthouse scores
        run: |
          node -e "const r=require('./lighthouse-${{ matrix.name }}.json'); for (const k of ['performance','accessibility','best-practices','seo']) console.log(k+': '+Math.round(r.categories[k].score*100))"
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.name }}
          path: lighthouse-${{ matrix.name }}.json
