
# Evidence Reviews are served from /worth-it/ and its existing child pages.
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions.send-free-guide]
  included_files = ["fitness-world-30-day-reset-free-preview.pdf"]

[functions.paypal-capture-order]
  included_files = ["private/Fitness_World_Natural_Wellness_Encyclopedia.pdf"]

[functions.download-encyclopedia]
  included_files = ["private/Fitness_World_Natural_Wellness_Encyclopedia.pdf", "private/Fitness_World_30-Day_Natural_Wellness_Reset.pdf"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"

# Versioned static asset caching. Every local CSS/JS URL carries a release query version,
# so immutable browser caching is safe while future releases bust the URL.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fitness-world-30-day-reset-free-preview.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "noindex"

# V15.16.188 product migration redirects: retired free-guide PDF -> Free Preview; legacy /checkout/ -> product checkout.
[[redirects]]
  from = "/fitness-world-free-guide.pdf"
  to = "/fitness-world-30-day-reset-free-preview.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/checkout"
  to = "/natural/#nw-checkout"
  status = 301
  force = true

[[redirects]]
  from = "/checkout/*"
  to = "/natural/#nw-checkout"
  status = 301
  force = true

# V15.16.188 retired cover images -> new covers
[[redirects]]
  from = "/assets/images/natural-wellness-cover.webp"
  to = "/assets/images/reset-cover-v188.webp"
  status = 301
  force = true

[[redirects]]
  from = "/assets/images/natural-wellness-cover.png"
  to = "/assets/images/reset-cover-v188.webp"
  status = 301
  force = true

[[redirects]]
  from = "/assets/images/free-guide-cover.webp"
  to = "/assets/images/free-preview-cover-v188.webp"
  status = 301
  force = true

[[redirects]]
  from = "/assets/images/free-guide-cover.jpg"
  to = "/assets/images/free-preview-cover-v188.webp"
  status = 301
  force = true

# Evidence Projects one-page consolidation redirects
[[redirects]]
  from = "/evidence-projects/healthy-aging/*"
  to = "/evidence-projects/#current-project"
  status = 301
  force = true

[[redirects]]
  from = "/evidence-projects/better-sleep/*"
  to = "/evidence-projects/#choose-next"
  status = 301
  force = true

[[redirects]]
  from = "/evidence-projects/womens-midlife-health/*"
  to = "/evidence-projects/#choose-next"
  status = 301
  force = true

[[redirects]]
  from = "/evidence-projects/heart-health/*"
  to = "/evidence-projects/#choose-next"
  status = 301
  force = true

[images]
  remote_images = ['https://images\.pexels\.com/.*']

