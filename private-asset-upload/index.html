<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Private Asset Upload | Fitness World</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f3ec;color:#172019;margin:0;padding:40px 20px}
main{max-width:640px;margin:auto;background:#fff;border:1px solid #dfe6dc;border-radius:18px;padding:28px}
h1{margin-top:0}label{display:block;font-weight:700;margin:18px 0 7px}
input,select,button{font:inherit}input[type=password],select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bdc8bf;border-radius:10px}
input[type=file]{width:100%}button{margin-top:22px;padding:13px 18px;border:0;border-radius:999px;background:#23241f;color:#fff;font-weight:800;cursor:pointer}
#status{margin-top:18px;white-space:pre-wrap}
small{color:#667168;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>Fitness World private PDF upload</h1>
<p>This temporary admin page stores the paid PDF in private Netlify Blobs. The PDF is never added to public GitHub.</p>
<label for="asset">Asset</label>
<select id="asset">
<option value="reset">30-Day Natural Wellness Reset (79-page paid PDF)</option>
<option value="encyclopedia">Legacy Natural Wellness Encyclopedia</option>
</select>
<label for="secret">Private upload secret</label>
<input id="secret" type="password" autocomplete="off">
<label for="file">PDF file</label>
<input id="file" type="file" accept="application/pdf,.pdf">
<button id="upload" type="button">UPLOAD PRIVATE PDF</button>
<div id="status" role="status" aria-live="polite"></div>
<p><small>After the paid Reset is verified in production, this temporary upload page and function should be removed.</small></p>
</main>
<script>
const btn=document.getElementById('upload'),statusEl=document.getElementById('status');
btn.addEventListener('click',async()=>{
  const secret=document.getElementById('secret').value;
  const asset=document.getElementById('asset').value;
  const file=document.getElementById('file').files[0];
  if(secret.length<24){statusEl.textContent='Enter the private upload secret.';return;}
  if(!file){statusEl.textContent='Choose the PDF first.';return;}
  if(file.size>20*1024*1024){statusEl.textContent='PDF is unexpectedly large.';return;}
  btn.disabled=true;statusEl.textContent='Uploading securely…';
  try{
    const bytes=new Uint8Array(await file.arrayBuffer());
    let binary='';const step=0x8000;
    for(let i=0;i<bytes.length;i+=step)binary+=String.fromCharCode(...bytes.subarray(i,Math.min(i+step,bytes.length)));
    const data=btoa(binary);
    const r=await fetch('/.netlify/functions/private-asset-upload',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-FW-Upload-Secret':secret},
      body:JSON.stringify({asset,data})
    });
    const d=await r.json().catch(()=>({}));
    if(!r.ok||d.stored!==true)throw new Error(d.error||'Upload failed');
    statusEl.textContent='Stored successfully.\nFile: '+d.key+'\nSize: '+d.size+' bytes\nSHA-256: '+d.sha256;
  }catch(err){statusEl.textContent='Upload failed: '+String(err.message||err);}
  finally{btn.disabled=false;}
});
</script>
</body>
</html>
